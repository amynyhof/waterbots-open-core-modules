# The number gate (scripts/check-figures.mjs): fails if a real project figure appears in what this repo makes public.
#
# It needs two private lists: the real project figures, and the name list. Both stay on the maintainer's machine
# and never come to GitHub. So the gate runs there: before every push (the pre-push hook in .githooks/) and on every
# release build (npm run pack-release).
#
# Here in CI the lists are absent. This job says so in plain words, as a warning and in the run's summary: the gate ran
# only locally. Its green tick says nothing about figures. Lane 3 review still reads every pull request.
# The job keeps its name ("number gate"), so a required check on that name stays in place.

name: number gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  number-gate:
    name: number gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - name: Number gate (runs only locally)
        run: node scripts/check-figures.mjs --ci
