# Publish to npm on a version tag, with provenance: a signed record, checkable by anyone, that the
# package was built from this exact commit.
#
# It refuses to run unless: the tagged commit is on main; there are packages to publish; the npm
# scope is real (not the "@<scope>" placeholder); and the NPM_TOKEN secret is set.
# It runs in the "npm-publish" environment. Amy's approval is required for every release: she is the
# environment's required reviewer, and only she may create v* tags.

name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # needed for provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse unless it is safe to publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."; exit 1
          fi
          if [ ! -f package.json ]; then
            echo "::error::Nothing to publish yet: no root package.json."; exit 1
          fi
          if grep -rIl --include=package.json --exclude-dir=node_modules '@<scope>' .; then
            echo "::error::The npm scope is still the '@<scope>' placeholder (waiting on Amy, N13)."; exit 1
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set."; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspaces --provenance --access public
