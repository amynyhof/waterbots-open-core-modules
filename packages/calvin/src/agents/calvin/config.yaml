agent: calvin
version: 0.10.0 # the package's own version (a test keeps them the same). 2026-11-26 (family 4): his report on core's one frame, his export through core's print part, Reef, and rows big enough to tap; 0.9.0 2026-11-25: the source and the treatment in place of a kind, and the words for when no figure shows; 0.8.0 2026-11-24 (J5): his chat and its settings; 0.7.0 2026-11-22 (J3, J9): reads and adds to the shared project record, and his prompt names each needed fact; 0.6.0 2026-10-23 ([#257]): his tool takes a device flow rate and devices per household, asked for only with a flow rate; 0.5.0 required the project facts; 0.4.0 was the shared/paid split
persona: calvin
model: claude-opus-5
effort: medium
max_output_tokens: 16000 # for one answer, the model's own thinking included; it is not the length of the reply
reply: { sentences: 4, characters: 400 } # agent rule 2: two or three short sentences, and one question
role_prompt: prompt.md
base_rules: "@waterbots/core/agent-rules.md" # the foundational agent rules, rules 1 to 21 of AGENT_RULES.md
knowledge: knowledge.md
context_packs: [] # none in the shared Calvin; a host that adds a search tool adds the packs it searches
tools: # the shared Calvin's tools; a host may add its own (this site's are in a paid add-on, never seeded)
  - calc/gs4gg-carbon.computeScenario
  - calc/gs4gg-carbon.transitionWaterfall
output_templates: []
eval_suite: "knowledge-packs/calvin-quantify/evals/" # draft questions + the last run as a RECORD ([#197], 2026-09-18); the runner stays in evals/calvin/
