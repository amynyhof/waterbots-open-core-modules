# Phoebe — the eligibility and feasibility agent. She finds which funding paths might suit a water project, on her
# eligibility worksheet, from her two knowledge packs: the water pathway (VWBA 2.0) and the carbon pathway (the safe
# drinking water carbon method). Status is draft: nothing here claims a grade or a credential.
agent: phoebe
version: 0.3.0 # the package's own version from now on (family 4: a test keeps them the same). 2026-11-26: her worksheet's tally as data for the rail, not a line in the chat; until now this line counted on its own, apart from the package: 0.1.0 2026-11-25 (J5): her first package, from the open site's agent at commit 0f16957
persona: phoebe
model: claude-opus-5 # the same as Calvin and Violet (the maintainer, 2026-11-25); the open site's own setting did not travel with the carry
effort: medium
max_output_tokens: 16000 # for one answer, the model's own thinking included; it is not the length of the reply
max_passes: 3 # one question may go to the model three times at most before it ends in an answer (24 Nov 2026)
reply: { sentences: 4, characters: 400 } # her own limit (13 Nov 2026), counted, never refused
role_prompt: prompt.md
base_rules: "@waterbots/core/agent-rules.md" # the foundational agent rules, rules 1 to 21 of AGENT_RULES.md
knowledge: # her two packs; the cards travel byte for byte
  - packs/vwba-2.0
  - packs/gs-paa-v2.0
tools:
  - eligibility-worksheet # defined in each pack's tool/eligibility-worksheet.yaml
status: draft
